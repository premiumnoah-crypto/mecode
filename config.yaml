# =====================================================================
#  新連載マンガ せどり判定システム  設定ファイル
# =====================================================================
# しきい値・重み付けはここで調整できます。
# APIキー等の秘密情報はここには書かず、環境変数(GitHub Secrets)で渡します。

# --- 判定の重み付け（合計が1.0でなくても自動正規化されます） -------------
weights:
  virality:          # バズりそうかスコアの内訳
    x_buzz:        0.40   # X(Twitter)のエンゲージメント
    reddit:        0.20   # 海外(Reddit)の盛り上がり
    trends:        0.15   # Google Trends 検索関心
    editorial:     0.15   # 掲載媒体・巻頭/カラー等の編集部プッシュ
    genre:         0.10   # ジャンルの追い風

  adaptation:        # アニメ化/映画化しそうかスコアの内訳
    virality:      0.35   # バズスコアの寄与
    editorial:     0.25   # 大手媒体・出版社の実績
    genre:         0.25   # 過去にアニメ化されやすいジャンルか
    international: 0.15   # 海外人気の広がり

  resale:            # せどり(初版10倍)妙味スコアの内訳
    adaptation:    0.45   # ヒット(=需要爆発)確率
    scarcity:      0.40   # 初版の希少性（少部数ほど高得点）
    collector:     0.15   # コレクター需要シグナル

# --- 判定しきい値（0-100スケール） ------------------------------------
thresholds:
  buy:   70    # これ以上で「積み増し購入(BUY)」推奨
  watch: 50    # これ以上で「ウォッチ(WATCH)」
  # それ未満は SKIP

# BUY時の推奨積み増し冊数（confidence帯ごと）
buy_quantity:
  high:   10   # resaleスコア >= 85
  medium: 5    # resaleスコア >= 77
  low:    3    # resaleスコア >= buyしきい値

# --- 監視対象の媒体ティア（editorialスコアの基礎点 0-100） --------------
# 過去のプレミア化・アニメ化実績を踏まえた媒体の強さ
platform_tiers:
  "週刊少年ジャンプ":        95
  "ジャンプ+":              90
  "週刊少年マガジン":        85
  "週刊少年サンデー":        80
  "ヤングジャンプ":          80
  "マガポケ":               75
  "コミックDAYS":           72
  "裏少年サンデー":          70
  "となりのヤングジャンプ":   70
  "ガンガンONLINE":         65
  "その他Web":              55
  "不明":                  50

# --- ジャンル追い風（過去のアニメ化/ヒット傾向 0-100） ------------------
genre_tailwind:
  "ダークファンタジー": 95
  "バトル":            90
  "異世界":            80
  "ラブコメ":          80
  "アクション":         85
  "サスペンス":         75
  "ホラー":            78
  "スポーツ":          70
  "日常":             60
  "ギャグ":            58
  "グルメ":            55
  "不明":             60

# --- X(Twitter) 検索設定 ---------------------------------------------
x_search:
  # 各作品名に付与して検索する補助ワード
  lang: "ja"
  max_results: 50          # recent searchで取得する最大ツイート数
  exclude_retweets: true

# --- Reddit 検索設定 -------------------------------------------------
reddit:
  subreddits:
    - "manga"
    - "MangaCollectors"
    - "MangaArt"
  time_filter: "month"
  limit: 25

# --- Google Trends 設定 ----------------------------------------------
trends:
  geo: ""        # "" = 全世界, "JP" = 日本のみ
  timeframe: "now 7-d"

# --- 新連載の自動発見 ------------------------------------------------
discovery:
  enabled: true
  # 「新連載」「連載開始」を含む記事から作品名候補を抽出するRSSフィード
  sources:
    - "https://natalie.mu/comic/feed/news"
  keywords:
    - "新連載"
    - "連載開始"
    - "連載スタート"
    - "新シリーズ"

# --- Claude による定性サマリー（任意） --------------------------------
claude:
  enabled: true
  model: "claude-sonnet-4-6"   # 日次運用のコストを考えcost効率モデルを既定に
  max_tokens: 1500

# --- レポート設定 ----------------------------------------------------
report:
  title: "新連載マンガ せどり判定 デイリーレポート"
  top_n: 15                # レポートに載せる上位件数
  save_dir: "reports"
  timezone: "Asia/Tokyo"
